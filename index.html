<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 選擇障礙終極助手</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI","Noto Sans TC",sans-serif;
  background:
    radial-gradient(circle at top left,#ffe1f2,transparent 30%),
    radial-gradient(circle at top right,#d8f3ff,transparent 35%),
    linear-gradient(135deg,#f7f2ff,#eef7ff);
  color:#241b44;
  min-height:100vh;
  padding:30px;
}
.hero{
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:28px;
  padding:36px;
  box-shadow:0 20px 60px rgba(80,70,150,.15);
  margin-bottom:28px;
}
.tag{
  letter-spacing:5px;
  color:#8b6cff;
  font-weight:800;
  font-size:13px;
}
h1{
  font-size:56px;
  margin:16px 0 10px;
}
.hero p{
  font-size:18px;
  color:#655d80;
}
.main{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:28px;
}
.card{
  background:rgba(255,255,255,.82);
  border-radius:26px;
  padding:26px;
  box-shadow:0 15px 45px rgba(80,70,150,.12);
  border:1px solid rgba(255,255,255,.9);
}
label{
  font-weight:800;
  margin-top:15px;
  display:block;
}
input{
  width:100%;
  padding:15px;
  border-radius:16px;
  border:1px solid #ddd6f6;
  margin-top:8px;
  font-size:16px;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:16px;
  margin-top:14px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}
.ai{background:#6c63ff;color:white}
.wheelBtn{background:#ffcf56;color:#3c2f00}
.boxBtn{background:#ff7aa2;color:white}
.stage{
  text-align:center;
  min-height:520px;
}
.orb{
  width:280px;
  height:280px;
  margin:35px auto;
  border-radius:50%;
  background:linear-gradient(135deg,#ffb6d9,#8e7dff);
  box-shadow:0 0 0 18px rgba(255,255,255,.7),0 25px 80px rgba(130,100,255,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  transition:1s;
}
.spin{
  animation:spin 1s linear infinite;
}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
.result{
  background:#f7f5ff;
  border-radius:22px;
  padding:24px;
  margin-top:25px;
  text-align:left;
  line-height:1.8;
  display:none;
}
.result h2{
  color:#6c48b8;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:20px;
}
.stat{
  background:#fbfaff;
  padding:18px;
  border-radius:18px;
  border:1px solid #e5defa;
}
.stat span{
  color:#8476a8;
  font-size:13px;
  font-weight:800;
  letter-spacing:2px;
}
.stat b{
  display:block;
  font-size:24px;
  margin-top:8px;
}
@media(max-width:900px){
  .main{grid-template-columns:1fr}
  h1{font-size:40px}
}
</style>
</head>

<body>

<section class="hero">
  <div class="tag">DECISION PLAYGROUND</div>
  <h1>AI 選擇障礙終極助手</h1>
  <p>把選擇交給 AI、命運轉盤或神秘盲盒，幫你快速結束猶豫。</p>
</section>

<section class="main">

<div class="card">
  <h2>輸入你的選擇</h2>

  <label>選項 A</label>
  <input id="optionA" placeholder="例如：火鍋">

  <label>選項 B</label>
  <input id="optionB" placeholder="例如：拉麵">

  <label>今天心情</label>
  <input id="mood" placeholder="例如：很累、很快樂、想放鬆">

  <label>預算</label>
  <input id="budget" type="number" placeholder="例如：300">

  <button class="ai" onclick="analyzeDecision()">🧠 AI 分析模式</button>
  <button class="wheelBtn" onclick="spinWheel()">🎡 命運轉盤</button>
  <button class="boxBtn" onclick="mysteryBox()">🎁 開啟命運盲盒</button>
</div>

<div class="card stage">
  <h2>決策舞台</h2>

  <div class="orb" id="orb">🎲</div>

  <div class="stats">
    <div class="stat">
      <span>MODE</span>
      <b id="modeText">待選擇</b>
    </div>
    <div class="stat">
      <span>RESULT</span>
      <b id="smallResult">尚未分析</b>
    </div>
    <div class="stat">
      <span>MOOD</span>
      <b id="moodText">待輸入</b>
    </div>
  </div>

  <div class="result" id="resultBox">
    <h2 id="titleResult"></h2>
    <div id="reasonResult"></div>
  </div>
</div>

</section>

<script>
function getInput(){
  let A=document.getElementById("optionA").value;
  let B=document.getElementById("optionB").value;
  let mood=document.getElementById("mood").value;
  let budget=Number(document.getElementById("budget").value);

  if(A==="" || B===""){
    alert("請先輸入兩個選項！");
    return null;
  }
  return {A,B,mood,budget};
}

function showResult(mode,choice,reason,emoji){
  document.getElementById("resultBox").style.display="block";
  document.getElementById("titleResult").innerHTML="推薦結果： " + choice;
  document.getElementById("reasonResult").innerHTML=reason;
  document.getElementById("modeText").innerHTML=mode;
  document.getElementById("smallResult").innerHTML=choice;
  document.getElementById("moodText").innerHTML=document.getElementById("mood").value || "未輸入";
  document.getElementById("orb").innerHTML=emoji;
}

function analyzeDecision(){
  let data=getInput();
  if(!data)return;

  let scoreA=0, scoreB=0;
  let reasons=[];

  if(data.mood.includes("累")||data.mood.includes("懶")||data.mood.includes("煩")){
    scoreB+=2;
    reasons.push("你現在的狀態比較需要省力，因此系統會偏向選擇較快速、負擔較低的選項。");
  }

  if(data.mood.includes("快樂")||data.mood.includes("放鬆")||data.mood.includes("開心")){
    scoreA+=2;
    reasons.push("你的心情狀態不錯，適合選擇更有儀式感、體驗感比較高的選項。");
  }

  if(data.budget && data.budget<200){
    scoreB+=2;
    reasons.push("目前預算偏低，所以系統會優先考慮比較不容易超支的選項。");
  }else if(data.budget>=300){
    scoreA+=2;
    reasons.push("你的預算相對充足，因此可以選擇滿足感或享受感更高的選項。");
  }

  if(data.A.includes("火鍋")||data.A.includes("燒肉")||data.A.includes("吃到飽")){
    scoreA+=2;
    reasons.push(data.A+" 通常飽足感高，也比較像是犒賞自己的選擇。");
  }

  if(data.B.includes("拉麵")||data.B.includes("便當")||data.B.includes("涼麵")){
    scoreB+=2;
    reasons.push(data.B+" 通常比較快速、方便，適合不想花太多時間猶豫的情況。");
  }

  let choice;
  if(scoreA>scoreB){
    choice=data.A;
  }else if(scoreB>scoreA){
    choice=data.B;
  }else{
    choice=Math.random()<0.5?data.A:data.B;
    reasons.push("兩個選項條件接近，因此系統啟動命運判定，幫你結束猶豫。");
  }

  let reason="<b>分析原因：</b><br><br>"+reasons.join("<br><br>")+
  "<br><br><b>最後結論：</b><br>綜合心情、預算與選項特性，現在比較推薦你選擇 <b>"+choice+"</b>。";

  showResult("AI 分析",choice,reason,"🧠");
}

function spinWheel(){
  let data=getInput();
  if(!data)return;

  let orb=document.getElementById("orb");
  orb.classList.add("spin");
  orb.innerHTML="🎡";
  document.getElementById("modeText").innerHTML="轉盤中";
  document.getElementById("smallResult").innerHTML="轉轉轉...";

  setTimeout(()=>{
    orb.classList.remove("spin");
    let choice=Math.random()<0.5?data.A:data.B;
    showResult("命運轉盤",choice,"🎡 轉盤已經替你做出選擇。<br><br>這個模式適合兩個選項都可以、但你真的不想再想的時候。","🎉");
  },2500);
}

function mysteryBox(){
  let data=getInput();
  if(!data)return;

  let choices=[data.A,data.B];
  let choice=choices[Math.floor(Math.random()*choices.length)];

  showResult("命運盲盒",choice,"🎁 盲盒開啟成功！<br><br>這不是理性分析，而是給猶豫太久的你一個快速答案。今天就選它。","🎁");
}
</script>

</body>
</html>
