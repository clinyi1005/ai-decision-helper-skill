<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 選擇障礙助手</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:90%;
    max-width:600px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:gray;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:25px;
    border:none;
    border-radius:10px;
    background:#667eea;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#5568d8;
}

.result{
    margin-top:30px;
    background:#f5f5f5;
    padding:20px;
    border-radius:15px;
    line-height:1.8;
    display:none;
}

.recommend{
    font-size:24px;
    font-weight:bold;
    color:#764ba2;
}

</style>
</head>

<body>

<div class="container">

<h1>AI 選擇障礙助手</h1>

<div class="subtitle">
幫助你快速做出選擇
</div>

<input type="text" id="optionA" placeholder="輸入選項 A">

<input type="text" id="optionB" placeholder="輸入選項 B">

<input type="text" id="mood" placeholder="今天心情如何？">

<input type="number" id="budget" placeholder="預算（元）">

<button onclick="analyzeDecision()">
開始分析
</button>

<div class="result" id="result">

<div class="recommend" id="recommendText"></div>

<div id="reasonText"></div>

</div>

</div>

<script>

function analyzeDecision(){

    let optionA = document.getElementById("optionA").value;
    let optionB = document.getElementById("optionB").value;
    let mood = document.getElementById("mood").value;
    let budget = document.getElementById("budget").value;

    let recommend = "";
    let reason = "";

    if(mood.includes("累")){

        recommend = optionB;

        reason =
        "因為你今天比較疲累，推薦選擇較輕鬆、快速的選項。";

    }else if(budget < 200){

        recommend = optionB;

        reason =
        "目前預算較低，推薦選擇較符合預算的選項。";

    }else{

        recommend = optionA;

        reason =
        "綜合分析後，推薦你選擇這個選項。";

    }

    document.getElementById("result").style.display = "block";

    document.getElementById("recommendText").innerHTML =
    "推薦選擇：" + recommend;

    document.getElementById("reasonText").innerHTML =
    "<br>分析原因：<br>" + reason;

}

</script>

</body>
</html>
